name: Sync Garmin Data to KV

"on":
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated categories to sync"
        required: false
        default: "sleep"
      backfill_days:
        description: "Days to backfill (e.g. 100 for a one-time historical seed)"
        required: false
        default: "3"
  schedule:
    - cron: '0 8 * * *' # daily, 08:00 UTC

permissions:
  contents: read

concurrency:
  group: sync-garmin-kv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install --group sync

      - name: Run sync
        run: pdm run python scripts/sync_to_kv.py --categories "$CATEGORIES" --backfill-days "$BACKFILL_DAYS"
        env:
          CATEGORIES: ${{ inputs.categories || 'sleep' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '3' }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
